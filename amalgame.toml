# Package manifest -- amalgame-pdf
#
# Generateur PDF 1.4 souverain, pur Amalgame -- multi-page, texte avec
# polices TrueType EMBARQUEES (Liberation Sans / Liberation Sans Bold,
# metric-compatibles Helvetica/Arial, SIL OFL -- voir vendor/OFL.txt)
# encodage WinAnsi, retour a la ligne automatique (WrapText/Flow),
# vecteurs (traits, rectangles pleins/contour) et images JPEG
# (DCTDecode). Aucune dependance native de rendu : ideal pour factures,
# rapports, editions imprimables -- y compris pour l'impression
# professionnelle (police embarquee = exigence standard des imprimeurs,
# ex. Vistaprint).
#
# API : cf. classe `Pdf` (facade.am). Coordonnees en points, origine
# coin haut-gauche ; rendu final en octets (List<int>).
#
# Installation :
#
#   amc package add pdf
#   amc package add github.com/amalgame-lang/amalgame-pdf@v0.3.0

[package]
name              = "amalgame-pdf"
version           = "0.3.1"
license           = "Apache-2.0"
description       = "Pure-Amalgame PDF 1.4 writer: multi-page, word-wrap, embedded TrueType fonts (Liberation Sans), vectors, JPEG images."
authors           = ["Bastien Mouget"]
required-amalgame = ">=0.8.90"
schema-version    = 1

[dependencies]
amalgame-crypto = ">=0.8.0"

[stdlib]
class     = "Pdf"
header    = "facade-stub.h"
namespace = "Amalgame.Formats.Pdf"
facade    = "facade.am"
