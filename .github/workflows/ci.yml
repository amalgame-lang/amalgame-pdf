name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test against amc ${{ matrix.amc-tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # amc 0.8.90+. The >=0.7.7 claimed until now was never true:
        # facade.am parses fine ALONE under 0.7.7 and 0.8.0, but fails
        # ("Expected '}' at 635:1") as soon as it is compiled together
        # with another file — which is exactly what the test suite does
        # (crypto_facade.am + pdf_facade.am + test.am). CI has therefore
        # been red since v0.3.0 while all 21 tests pass locally: it was
        # testing a compiler that could never build this package.
        # Verified by hand across 0.7.7 / 0.8.0 (both fail) and 0.8.90
        # (passes).
        amc-tag: [v0.8.90]
    steps:
      - name: Checkout package
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgc-dev libcurl4-openssl-dev libssl-dev

      - name: Download amc ${{ matrix.amc-tag }}
        run: |
          set -e
          TAG="${{ matrix.amc-tag }}"
          VERSION="${TAG#v}"
          curl -sSL -o amc.tar.gz \
            "https://github.com/amalgame-lang/Amalgame/releases/download/${TAG}/amc-${VERSION}-linux-x86_64.tar.gz"
          mkdir -p $RUNNER_TEMP/amc-install
          tar -xzf amc.tar.gz -C $RUNNER_TEMP/amc-install --strip-components=1
          # Le layout des archives a changé entre 0.7.x (amc + runtime/
          # à la racine) et 0.8.9x (bin/amc + share/amalgame/runtime).
          # Mêmes chemins que amalgame-net-http, qui teste déjà en 0.8.x.
          echo "AMC=$RUNNER_TEMP/amc-install/bin/amc" >> $GITHUB_ENV
          echo "AMC_RUNTIME=$RUNNER_TEMP/amc-install/share/amalgame/runtime" >> $GITHUB_ENV

      - name: Verify amc
        run: $AMC --version

      - name: Run tests
        run: ./tests/run_tests.sh "$AMC"
